  <!-- Círculo decorativo -->
  <circle cx="35" cy="35" r="25" fill="#5092ab" opacity="0.1"/>
  <circle cx="35" cy="35" r="15" fill="#5092ab" opacity="0.2"/>
  
  <!-- Icono de gestión/documento -->
